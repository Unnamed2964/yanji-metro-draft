name: Probe Windows CJK fonts

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe Chinese supplemental fonts
        shell: pwsh
        run: ./scripts/probe-windows-cjk-fonts.ps1

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: probe-windows-fonts-report
          path: probe-windows-fonts-report.txt
